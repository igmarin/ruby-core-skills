name: rs-guard-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rs-guard-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install rs-guard
        run: |
          curl -fsSL -o rs-guard https://github.com/nebulaideas/rs-guard/releases/download/v1.0.0/rs-guard
          curl -fsSL -o rs-guard.sha256 https://github.com/nebulaideas/rs-guard/releases/download/v1.0.0/rs-guard.sha256
          sha256sum --check rs-guard.sha256
          chmod +x rs-guard
          sudo mv rs-guard /usr/local/bin/
          rs-guard --version

      - name: Generate diff
        run: |
          git diff --no-color "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}" > pr-diff.txt
          echo "Diff size: $(wc -c < pr-diff.txt) bytes"

      - name: Run rs-guard review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: rs-guard --diff-file pr-diff.txt
